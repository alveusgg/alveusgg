name: Update Chatbot

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "preview"
    paths:
      - "apps/chatbot/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/update-chatbot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: ${{ vars.CHATBOT_COMPOSE_PROJECT_NAME }}
  CHATBOT_PATH: ${{ vars.CHATBOT_PATH }}
  REF_NAME: ${{ github.ref_name }}
  REF_SHA: ${{ github.sha }}
  SENTRY_ENVIRONMENT: ${{ (github.ref == 'refs/heads/main' && 'production') || 'preview' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read # Associate the deployed commit with the Sentry release.
  packages: read # Authenticate package downloads during the remote image build.

jobs:
  deploy:
    name: Deploy (${{ (github.ref == 'refs/heads/main' && 'production') || 'preview' }})
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'preview' }}
    runs-on: ubuntu-latest
    if: github.repository == 'alveusgg/alveusgg'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Chatbot via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          envs: COMPOSE_PROJECT_NAME,CHATBOT_PATH,REF_NAME,REF_SHA,SENTRY_ENVIRONMENT,GITHUB_TOKEN
          host: ${{ secrets.CHATBOT_HOST }}
          username: ${{ secrets.CHATBOT_USERNAME }}
          key: ${{ secrets.CHATBOT_KEY }}
          port: ${{ secrets.CHATBOT_PORT }}
          passphrase: ${{ secrets.CHATBOT_PASSPHRASE }}
          script: |
            set -e
            cd $CHATBOT_PATH
            git fetch origin $REF_NAME && git reset --hard origin/$REF_NAME
            cd apps/chatbot
            CHATBOT_REF_SHA=$REF_SHA SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT docker compose up --build --detach
            docker system prune --force

      - name: Create Sentry Release
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: alveus-sanctuary
          SENTRY_PROJECT: chatbot
        with:
          # The chatbot runs uncompiled via tsx, so there are no sourcemaps to upload
          ignore_missing: true
          ignore_empty: true
          inject: false
          release: ${{ github.sha }}
          environment: ${{ env.SENTRY_ENVIRONMENT }}
