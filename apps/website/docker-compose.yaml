services:
  db:
    image: mysql:8
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: alveusgg_secret
    volumes:
      - db:/var/lib/mysql

  s3:
    image: andrewgaul/s3proxy:4.1.1
    ports:
      - 9000:9000
    environment:
      S3PROXY_IDENTITY: alveusgg_key
      S3PROXY_CREDENTIAL: alveusgg_secret
      S3PROXY_ENDPOINT: http://0.0.0.0:9000
    post_start:
      - command: mkdir -p /data/alveusgg
    volumes:
      - s3:/data

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redis:/data

volumes:
  db:
  s3:
  redis:
